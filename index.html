<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>

<body class="login-container">

  <div class="glass-card login-card">
    <div class="logo-container" style="justify-content: center; margin-bottom: 30px;">
      <img src="assets/logo.png" alt="EduTrack Logo" class="logo-img-nav" style="width: 100px; height: 100px;">
      <span class="logo-text" style="font-size: 54px;">EduTrack</span>
    </div>
    <h1 id="authTitle" style="margin-bottom: 8px;">Welcome Back</h1>
    <p id="authSubtitle" style="color: #64748b; margin-bottom: 24px;">Sign in to track your progress</p>

    <div style="text-align: left;">
      <div id="nameField" style="display: none;">
        <label style="font-size: 14px; font-weight: 600; margin-bottom: 4px; display: block;">Full Name</label>
        <input id="name" type="text" placeholder="John Doe" style="margin-bottom: 16px;">
      </div>

      <label style="font-size: 14px; font-weight: 600; margin-bottom: 4px; display: block;">Email Address</label>
      <input id="email" type="email" placeholder="name@example.com" style="margin-bottom: 16px;">

      <label style="font-size: 14px; font-weight: 600; margin-bottom: 4px; display: block;">Password</label>
      <input id="password" type="password" placeholder="••••••••" style="margin-bottom: 20px;">
    </div>

    <button id="mainBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login</button>

    <p id="toggleText" style="margin-top: 20px; font-size: 14px; color: #64748b;">
      Don't have an account? <span id="toggleAuth"
        style="color: var(--primary); cursor: pointer; font-weight: 600;">Create one</span>
    </p>

    <div style="margin-top: 24px;">
      <button id="themeToggle" class="theme-toggle-btn">☾</button>
    </div>
  </div>

  <script type="module" src="./js/auth.js"></script>

  <script>
    const btn = document.getElementById("themeToggle");

    function setTheme(mode) {
      document.body.classList.toggle("dark", mode === "dark");
      btn.innerText = mode === "dark" ? "☀︎" : "☾";
      localStorage.setItem("theme", mode);
    }

    const saved = localStorage.getItem("theme");
    if (saved) setTheme(saved);
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme("dark");

    btn.onclick = () => {
      const dark = document.body.classList.contains("dark");
      setTheme(dark ? "light" : "dark");
    };
  </script>
</body>

</html>
