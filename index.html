<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduTrack Login</title>

  <style>
    /* ================= BASE ================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s, color 0.3s;
    }

    /* ================= LIGHT ================= */

    body {
      background: #f5f5f5;
      color: #111;
    }

    /* ================= DARK ================= */

    body.dark {
      background: #121212;
      color: #fff;
    }

    /* ================= CARD ================= */

    .card {
      width: 90%;
      max-width: 360px;
      padding: 28px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
      transition: background 0.3s;
    }

    body.dark .card {
      background: #1e1e1e;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    body.dark input {
      background: #2a2a2a;
      border: none;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #loginBtn {
      background: #4CAF50;
      color: white;
    }

    #registerBtn {
      background: #2196F3;
      color: white;
    }

    /* ================= THEME TOGGLE ================= */

    .theme-toggle {
      position: fixed;
      bottom: 18px;
      /* ⭐ bottom */
      left: 18px;
      /* ⭐ leftmost */
      border: none;
      background: #00000020;
      backdrop-filter: blur(6px);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    body.dark .theme-toggle {
      background: #ffffff20;
    }

    /* ================= MOBILE POLISH ================= */

    @media(max-width:480px) {
      .card {
        padding: 22px;
      }
    }
  </style>
</head>



<body>

  <!-- Toggle -->
  <button id="themeToggle" class="theme-toggle">☾</button>


  <!-- Login Card -->
  <div class="card">

    <!-- ⭐ Logo (you will add image later) -->
    <img id="logo" src="" alt="" style="display:none; width:90px; margin-bottom:15px;">

    <h2>Login</h2>


    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>
    <button id="registerBtn">Register</button>
  </div>


  <!-- Firebase -->
  <script type="module" src="./js/auth.js"></script>


  <!-- ================= THEME SCRIPT ================= -->
  <script>
    const btn = document.getElementById("themeToggle");

    function setTheme(mode) {
      document.body.classList.toggle("dark", mode === "dark");
      btn.innerText = mode === "dark" ? "☀︎" : "☾";
      localStorage.setItem("theme", mode);
    }

    // load saved or device theme
    const saved = localStorage.getItem("theme");

    if (saved) {
      setTheme(saved);
    }
    else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      setTheme("dark");
    }

    btn.onclick = () => {
      const dark = document.body.classList.contains("dark");
      setTheme(dark ? "light" : "dark");
    };
  </script>

</body>

</html>
