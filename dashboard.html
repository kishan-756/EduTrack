<!DOCTYPE html>
<html>

<head>
  <title>EduTrack Dashboard</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    nav {
      background: #222;
      padding: 12px;
      display: flex;
      gap: 15px;
    }

    nav button {
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }

    .section {
      display: none;
      padding: 20px;
    }

    .active {
      display: block;
    }

    input, select {
      margin: 5px;
      padding: 6px;
    }

    .days label {
      margin-right: 10px;
    }
  </style>
</head>

<body>

  <nav>
    <button id="scheduleTab">Schedule</button>
    <button id="plannerTab">Planner</button>
    <button id="cgpaTab">CGPA</button>
    <button id="logoutBtn">Logout</button>
  </nav>

  <p id="user" style="padding:10px"></p>


  <!-- ================= SCHEDULE ================= -->
  <div id="scheduleSection" class="section active">

    <h3>Scheduler</h3>

    <input id="title" placeholder="Activity / Work / Class">

    <div class="days">
      <label><input type="checkbox" value="Monday">Mon</label>
      <label><input type="checkbox" value="Tuesday">Tue</label>
      <label><input type="checkbox" value="Wednesday">Wed</label>
      <label><input type="checkbox" value="Thursday">Thu</label>
      <label><input type="checkbox" value="Friday">Fri</label>
      <label><input type="checkbox" value="Saturday">Sat</label>
    </div>

    <input id="time" type="time">

    <button id="addBtn">Add</button>

    <ul id="list"></ul>
  </div>


  <!-- ================= PLANNER ================= -->
  <div id="plannerSection" class="section">

    <h3>Planner</h3>

    <input id="taskInput" placeholder="Enter task">
    <button id="taskBtn">Add Task</button>

    <ul id="taskList"></ul>
  </div>


  <!-- ================= CGPA ================= -->
  <div id="cgpaSection" class="section">

    <h3>CGPA Calculator</h3>

    <input id="subName" placeholder="Subject">
    <input id="credits" type="number" placeholder="Credits">
    <input id="grade" placeholder="Grade">

    <button id="addSubBtn">Add</button>

    <ul id="cgpaList"></ul>

    <h3 id="cgpaResult">CGPA: 0</h3>

  </div>

  <script type="module" src="./js/dashboard.js"></script>

</body>
</html>
